<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin sign in · RITDorg</title>
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .card { width: 100%; max-width: 380px; background: #111c33; border: 1px solid #1e293b; border-radius: 12px; padding: 28px; }
        h1 { margin: 0 0 6px; font-size: 1.4rem; }
        p.sub { margin: 0 0 20px; color: #94a3b8; font-size: 0.9rem; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin: 12px 0 6px; }
        input { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #334155; background: #0b1220; color: #e2e8f0; font-size: 0.95rem; box-sizing: border-box; }
        button { margin-top: 20px; width: 100%; padding: 11px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .err { background: rgba(220,38,38,0.15); border: 1px solid rgba(220,38,38,0.4); padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="card">
    <h1>Admin sign in</h1>
    <p class="sub">Restricted area. Credentials required.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('admin_login') }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
    </form>
</div>
</body>
</html>
