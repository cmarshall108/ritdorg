<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} — RITDorg</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 1.5rem;
    }
    .card {
      max-width: 28rem;
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.75rem 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      text-align: center;
    }
    h1 { margin: 0 0 .5rem; font-size: 2rem; letter-spacing: .02em; }
    p { margin: 0 0 1.25rem; color: #94a3b8; line-height: 1.5; }
    a {
      display: inline-block;
      text-decoration: none;
      background: #2563eb;
      color: #fff;
      padding: .65rem 1.1rem;
      border-radius: 8px;
      font-weight: 600;
    }
    a:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{ code }}</h1>
    <p>{{ message or "Something went wrong." }}</p>
    <a href="/">Back to reader</a>
  </div>
</body>
</html>
